# Deploys the production name service, gestion-nombres.apsconecta.workers.dev, from main only. PR runs deploy the separate
# CI deployment from the release pipeline (aps-release.yml).
name: APS name service

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aps-name-service.yml
      - aps/deis/**
      - aps/name-service/**
      - aps/provisionador/deis.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: aps-name-service-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the production name service from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy gestion-nombres.apsconecta.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: aps/name-service/deploy.sh production
