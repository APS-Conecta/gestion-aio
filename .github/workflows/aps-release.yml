# SPDX-License-Identifier: AGPL-3.0-or-later
# A test build, on a pull request or a dispatch without a version: our three images built from the release commit, the
# official images checked against upstream's v14.4.3 set, the bundle and the pre-release v0.0.0-ci.<run>; then the
# bootstrap is run from that pre-release on fresh runners and in the clean-machine acceptance run, and the thin Caddy
# image gets a staging certificate through the name service's CI deployment.
# A release, dispatched from main with a new version (gh workflow run aps-release.yml --ref main -f version=v1.0.0),
# needs no other step. Its candidate, built the same way for production's name service and Let's Encrypt with no
# staging root, is published as a pre-release kept from «Latest»; the one command on a fresh runner and the host checks
# run on it (v1.1.0 is cut without the clean-machine acceptance runs). Only once every check passed does the candidate
# become the release «Latest», which the one command installs:
#   curl -fsSL https://github.com/APS-Conecta/gestion-aio/releases/latest/download/install.sh | sudo bash
# A candidate that did not pass is withdrawn with its tag. aps/gates/release.py holds this workflow to these rules.
name: APS release

on:
  pull_request:
    paths:
      - .github/workflows/aps-acceptance.yml
      - .github/workflows/aps-release.yml
      - aps/acceptance/**
      - aps/bootstrap/**
      - aps/brand/**
      - aps/deis/**
      - aps/images/**
      - aps/name-service/**
      - aps/provisionador/**
      - aps/release/**
      - aps/theme/**
      - community-containers/caddy/**
      - Containers/mastercontainer/**
      - php/**
  workflow_dispatch:
    inputs:
      version:
        description: Release to cut from main, such as v1.0.0; empty for a test build
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: aps-release-${{ inputs.version != '' && 'version' || github.head_ref || github.ref }}
  cancel-in-progress: ${{ inputs.version == '' }}

env:
  MASTERCONTAINER: ghcr.io/aps-conecta/gestion-mastercontainer
  NEXTCLOUD: ghcr.io/aps-conecta/gestion-nextcloud
  CADDY: ghcr.io/aps-conecta/gestion-caddy

jobs:
  images:
    name: Build our images from the release commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      mastercontainer: ${{ steps.mastercontainer.outputs.pinned }}
      nextcloud: ${{ steps.nextcloud.outputs.pinned }}
      caddy: ${{ steps.caddy.outputs.pinned }}
    steps:
      - name: Name the build (on a pull request, its commit is the merge preview); a release is a new version of main
        id: release
        env:
          COMMIT: ${{ github.sha }}
          TEST_TAG: v0.0.0-ci.${{ github.run_number }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A release's version is vX.Y.Z."; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A release is cut from main, not $GITHUB_REF."; exit 1; }
            tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"
            ! grep -qxF "$VERSION" <<< "$tags" || { echo "::error::$VERSION exists already."; exit 1; }
            newest="$({ grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' <<< "$tags" || true; } | sort -V | tail -n 1)"
            [ -z "$newest" ] || [ "$(printf '%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] \
              || { echo "::error::$VERSION is not above the newest release tag, $newest."; exit 1; }
          fi
          printf 'tag=%s\ncommit=%s\n' "${VERSION:-$TEST_TAG}" "$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every official image is pinned by digest to upstream's set
        run: |
          base="$(sed -n 's/^# base: \([0-9a-f]\{40\}\) .*/\1/p' aps/keep-list.txt)"
          { jq -r --arg ours "$NEXTCLOUD" '.aio_services_v1[] | select(.image != $ours) | "\(.image)@\(.image_tag)"' php/containers.json
            sed -n 's/^FROM //p' aps/images/nextcloud/Dockerfile; } \
            | while read -r pinned; do
                case "$pinned" in *@sha256:*) ;; *) echo "::error::$pinned is not pinned by digest"; exit 1 ;; esac
                aps/release/revision.sh "$pinned" "$base"
              done
      - name: Every base of our images is pinned by digest
        run: |
          for dockerfile in aps/images/*/Dockerfile; do
            awk '/^FROM / { if (!($2 in stages) && $2 !~ /@sha256:[0-9a-f]{64}$/) bad = bad " " $2; if (toupper($3) == "AS") stages[$4] }
                 END { if (bad) { print "::error::" FILENAME " has bases not pinned by digest:" bad; exit 1 } }' "$dockerfile"
          done
      - name: Log in to ghcr.io and set up buildx
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
      - name: Build the thin Nextcloud image
        id: nextcloud
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          pinned="$(aps/release/build-image.sh "$NEXTCLOUD" aps/images/nextcloud/Dockerfile aps/images/nextcloud "$TAG" "$COMMIT")"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
      - name: Build the thin Caddy image
        id: caddy
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          pinned="$(aps/release/build-image.sh "$CADDY" aps/images/caddy/Dockerfile aps/images/caddy "$TAG" "$COMMIT")"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
      - name: Build the mastercontainer with our Nextcloud and Caddy images pinned, and the brand on AIO's page
        id: mastercontainer
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PINNED_NEXTCLOUD: ${{ steps.nextcloud.outputs.pinned }}
          PINNED_CADDY: ${{ steps.caddy.outputs.pinned }}
        run: |
          pin() { # <containers file> <image@digest>: the image's image_tag becomes its digest
            jq --arg image "${2%@*}" --arg digest "${2#*@}" \
              '(.aio_services_v1[] | select(.image == $image) | .image_tag) = $digest' "$1" > "$RUNNER_TEMP/pinned.json"
            mv "$RUNNER_TEMP/pinned.json" "$1"
            [ "$(jq -r --arg image "${2%@*}" '[.aio_services_v1[] | select(.image == $image) | .image_tag] | join(" ")' "$1")" = "${2#*@}" ]
          }
          pin php/containers.json "$PINNED_NEXTCLOUD"
          pin community-containers/caddy/caddy.json "$PINNED_CADDY"
          aps/release/brand.sh
          pinned="$(aps/release/build-image.sh "$MASTERCONTAINER" Containers/mastercontainer/Dockerfile . "$TAG" "$COMMIT")"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

  release:
    name: Publish the pre-release
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      previous: ${{ steps.previous.outputs.previous }}
    env:
      TAG: ${{ needs.images.outputs.tag }}
      COMMIT: ${{ needs.images.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release before this one, which the upgrade acceptance installs first
        id: previous
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)"
          [ -n "$previous" ] || { echo "::error::No published release to upgrade from, and a release always upgrades the previous one."; exit 1; }
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Assemble the bundle, install.sh and SHA256SUMS
        env:
          PINNED_MASTERCONTAINER: ${{ needs.images.outputs.mastercontainer }}
          PINNED_NEXTCLOUD: ${{ needs.images.outputs.nextcloud }}
          PINNED_CADDY: ${{ needs.images.outputs.caddy }}
        run: aps/release/package.sh "$TAG" "$PINNED_MASTERCONTAINER" "$PINNED_NEXTCLOUD" "$PINNED_CADDY" dist
      - name: Publish the pre-release, kept from «Latest»
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            title="APS Conecta Gestión $TAG (candidata)"
            notes="Candidata en verificación en una máquina limpia: no la instale. Será la versión vigente solo si pasa todas las comprobaciones."
          else
            title="APS Conecta Gestión $TAG (prueba)"
            notes="Versión de prueba, no apta para establecimientos. Instalación: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sudo bash"
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease --latest=false \
            --title "$title" --notes "$notes"
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true ]
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          [ "$latest" != "$TAG" ] || { echo "::error::$TAG became Latest"; exit 1; }

  bootstrap:
    name: The one command on a fresh runner
    needs: [images, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ needs.images.outputs.tag }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.images.outputs.tag }}
    steps:
      - name: Make the runner a clean machine (no Docker, room for the images)
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          packages="$(dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n' 'docker*' 'moby-*' 'containerd*' 2>/dev/null || true)"
          printf '%s\n' "$packages" | awk '/^ii/ {print $2}' | xargs --no-run-if-empty sudo apt-get -qq purge -y
          { grep -rlF download.docker.com /etc/apt/sources.list.d || true; } | xargs --no-run-if-empty sudo rm -f
          sudo rm -rf /var/lib/docker /var/lib/containerd /etc/docker /etc/apt/keyrings/docker* \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          [ -z "$(command -v docker)" ]
          df -h /
      - name: A tampered bundle is refused before anything is unpacked
        run: |
          mkdir mirror
          curl -fsSL --retry 5 -o "mirror/gestion-aio-$TAG.tar.gz" "$RELEASE_URL/gestion-aio-$TAG.tar.gz"
          printf 'x' >> "mirror/gestion-aio-$TAG.tar.gz"
          python3 -m http.server 8099 --bind 127.0.0.1 --directory mirror > /dev/null 2>&1 &
          server=$!
          sleep 2
          rc=0
          curl -fsSL "$RELEASE_URL/install.sh" | sudo env GESTION_DOWNLOAD_URL=http://127.0.0.1:8099 bash 2> refused.log || rc=$?
          kill "$server"
          cat refused.log
          [ "$rc" -ne 0 ]
          grep -q 'no coincide con su suma de verificación' refused.log
          [ ! -e /opt/aps-conecta ]
          [ -z "$(command -v docker)" ]
      - name: Run the one command, as an operator would
        run: curl -fsSL "$RELEASE_URL/install.sh" | sudo bash | tee first.log
      - name: Docker Engine came from Docker's packages
        run: apt-cache policy docker-ce | grep 'https://download.docker.com/linux/ubuntu' > /dev/null
      - name: With the install folder gone, the one command restores it and prints a fresh one-time link
        run: |
          sudo rm -rf /opt/aps-conecta/gestion
          printed="$(curl -fsSL "$RELEASE_URL/install.sh" | sudo bash)" # the new link stays out of the log
          [ "$(cat /opt/aps-conecta/gestion/VERSION)" = "$TAG" ]
          [ -f /opt/aps-conecta/gestion/provisionador/provisionador.py ]
          link='https://[^[:space:]]*/#[^[:space:]]*'
          fresh="$(grep -o "$link" <<< "$printed" || true)"
          if [ -z "$fresh" ] || [ "$fresh" = "$(grep -o "$link" first.log)" ]; then
            echo "::error::the rerun printed no fresh one-time link"
            exit 1
          fi
      - name: Show the containers and the logs
        if: failure()
        run: |
          sudo docker ps -a || true
          sudo docker logs nextcloud-aio-mastercontainer 2>&1 | tail -n 100 || true

  certificate:
    name: A staging certificate through the name service, with no open port
    needs: images
    if: inputs.version == '' # a release gets a real certificate in its acceptance run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every run shares the one CI deployment: one deploy-and-prove at a time.
    concurrency:
      group: aps-name-service-ci
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Right before the proof, so another PR's deployment has the least time to replace it.
      - name: Deploy the name service's CI deployment, gestion-nombres-ci.apsconecta.workers.dev, from this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: aps/name-service/deploy.sh ci
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Claim a CI name and get its staging certificate with the thin Caddy image
        id: certificate
        env:
          PINNED_CADDY: ${{ needs.images.outputs.caddy }}
        run: aps/release/certificate.sh "$PINNED_CADDY"
      - name: Release the CI name, and its challenge record is gone
        if: always() && steps.certificate.outputs.code != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CODE: ${{ steps.certificate.outputs.code }}
          NAME: ${{ steps.certificate.outputs.name }}
        run: |
          aps/name-service/names.sh ci release "$CODE"
          ns="$(dig +short NS apsconecta.cl | head -n 1)"
          for _ in $(seq 12); do
            left="$(dig +short TXT "_acme-challenge.$NAME" "@$ns")"
            [ -z "$left" ] && exit 0
            sleep 5
          done
          echo "::error::_acme-challenge.$NAME outlived the release: $left"
          exit 1

  acceptance:
    name: Clean-machine acceptance
    needs: [images, release]
    if: inputs.version == '' # v1.1.0 is cut without it (owner, 2026-11-11: no Let's Encrypt certificate is left)
    permissions:
      contents: read
    uses: ./.github/workflows/aps-acceptance.yml
    with:
      tag: ${{ needs.images.outputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  host-checks:
    name: A machine below the minimum is refused before it is changed
    needs: [images, release]
    runs-on: ubuntu-24.04-arm
    permissions: {}
    env:
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.images.outputs.tag }}
      UBUNTU: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    steps:
      - name: An arm64 machine with 1 CPU, 2 GiB of memory and 1 GB of disk
        run: |
          curl -fsSL --retry 5 -o install.sh "$RELEASE_URL/install.sh"
          printf 'MemTotal:        2097152 kB\n' > meminfo
          rc=0
          docker run --rm --cpuset-cpus 0 --tmpfs /var/lib:size=1g \
            --volume "$PWD/meminfo:/proc/meminfo:ro" --volume "$PWD/install.sh:/install.sh:ro" "$UBUNTU" \
            bash -c 'bash /install.sh; rc=$?
              [ ! -e /opt/aps-conecta ] && [ ! -e /etc/apt/sources.list.d/docker.sources ] \
                || { echo "the host was changed" >&2; exit 99; }
              exit "$rc"' > refused.log 2>&1 || rc=$?
          cat refused.log
          floor() { sed -n "s/^$1=\([0-9][0-9]*\)$/\1/p" install.sh; } # the bootstrap's floors are set there alone
          [ "$rc" -eq 1 ]
          grep -q 'No se modificó nada' refused.log
          grep -q 'la arquitectura del procesador es aarch64; se requiere x86_64' refused.log
          grep -q "tiene 2 GiB de memoria; se requieren al menos $(floor MIN_MEMORY_GIB) GiB$" refused.log
          grep -q "tiene 1 núcleo(s) de CPU; se requieren al menos $(floor MIN_CPUS)$" refused.log
          grep -q "GB libres en /var/lib; se requieren al menos $(floor MIN_DISK_GB) GB$" refused.log
      - name: Memory rounds up, so the floor's machine passes with kdump's 512 MiB reserved, and 1 GiB less does not
        run: |
          floor="$(sed -n 's/^MIN_MEMORY_GIB=\([0-9][0-9]*\)$/\1/p' install.sh)"
          [ -n "$floor" ]
          refusal() { # <MemTotal in kB>: what the bootstrap prints on this arm64 machine (refused for its architecture)
            printf 'MemTotal: %s kB\n' "$1" > meminfo
            docker run --rm --volume "$PWD/meminfo:/proc/meminfo:ro" --volume "$PWD/install.sh:/install.sh:ro" \
              "$UBUNTU" bash /install.sh 2>&1 || true
          }
          # the floor's machine less kdump's 512 MiB and about 150 MiB the kernel keeps: about 5.35 GiB for 6
          kdump="$(refusal $(( floor * 1048576 - 524288 - 153600 )))"
          echo "$kdump"
          grep -q 'No se modificó nada' <<< "$kdump"
          if grep -q 'de memoria' <<< "$kdump"; then
            echo "::error::the floor's machine with kdump was refused for its memory"
            exit 1
          fi
          short="$(refusal $(( (floor - 1) * 1048576 )))"
          echo "$short"
          grep -q "tiene $(( floor - 1 )) GiB de memoria; se requieren al menos $floor GiB$" <<< "$short"

  publish:
    name: The candidate becomes the release «Latest» once every check passed, and the one command installs it
    needs: [images, release, bootstrap, host-checks]
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.images.outputs.tag }}
      COMMAND: curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
    steps:
      - name: Publish the release as «Latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest \
            --title "APS Conecta Gestión $TAG" \
            --notes "Instale APS Conecta Gestión en una máquina limpia con este comando: $COMMAND"
      - name: Within about 10 minutes, «Latest» is the release and the one command fetches the install.sh it checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(curl -fsSL --retry 5 "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS" \
            | awk '$2 == "install.sh" {print $1}')"
          [ -n "$expected" ] || { echo "::error::$TAG's SHA256SUMS lists no install.sh"; exit 1; }
          for _ in $(seq 60); do
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)"
            served="$({ curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" || true; } \
              | sha256sum | cut -d ' ' -f 1)"
            if [ "$latest" = "$TAG" ] && [ "$served" = "$expected" ]; then
              echo "«Latest» is $TAG, and $COMMAND installs it"
              exit 0
            fi
            sleep 10
          done
          echo "::error::After 10 minutes «Latest» is ${latest:-unknown}, and the one command's install.sh is $served, not $TAG's $expected"
          exit 1

  withdraw:
    name: A candidate that did not pass is withdrawn with its tag, so the version can be cut again
    needs: [images, release, publish]
    if: always() && inputs.version != '' && needs.release.result != 'skipped' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.images.outputs.tag }}
      COMMIT: ${{ needs.images.outputs.commit }}
    steps:
      - name: Delete this run's candidate pre-release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! candidate="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '"\(.prerelease) \(.target_commitish)"' 2> "$RUNNER_TEMP/withdraw.err")"; then
            cat "$RUNNER_TEMP/withdraw.err" >&2
            grep -q '(HTTP 404)' "$RUNNER_TEMP/withdraw.err" || exit 1
            echo "No release $TAG is left to withdraw."
            exit 0
          fi
          [ "$candidate" = "true $COMMIT" ] || { echo "$TAG is not this run's candidate of $COMMIT: nothing withdrawn."; exit 0; }
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "$TAG did not pass every check: its candidate and its tag were withdrawn."
